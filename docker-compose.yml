services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_DB: vointika
      POSTGRES_USER: vointika
      POSTGRES_PASSWORD: vointika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single-node Kafka in KRaft mode (no Zookeeper). The app reaches it over the
  # compose network at kafka:9092.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: create the avatars bucket and make it publicly readable (resolved
  # avatar URLs are fetched anonymously). Idempotent; re-runs on every up.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-minioadmin}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 \"$$APP_S3_ACCESS_KEY\" \"$$APP_S3_SECRET_KEY\" 2>/dev/null; do
        echo 'minio-init: waiting for MinIO...'; sleep 1;
      done &&
      /usr/bin/mc mb --ignore-existing local/avatars &&
      /usr/bin/mc anonymous set download local/avatars &&
      echo 'minio-init: avatars bucket ready.'
      "
    restart: "no"

  # Local SESv2 mock (dev only). The notification SES adapter is pointed here via
  # APP_SES_ENDPOINT; "sent" mail is captured and readable at GET :8005/store.
  ses:
    image: node:22.23.1-alpine
    command: npx --yes aws-ses-v2-local@2.10.0
    ports:
      - "8005:8005"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Prefer IPv4 for outbound calls. Docker's embedded DNS occasionally
      # returns IPv6-only answers for AWS endpoints (e.g. SES), surfacing as a
      # transient UnknownHostException that drops a confirmation email.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vointika
      SPRING_DATASOURCE_USERNAME: vointika
      SPRING_DATASOURCE_PASSWORD: vointika
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: super-secret-key-change-me-in-production-must-be-at-least-32-chars
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
      # Dev email → the local SESv2 mock (the `ses` service). Dummy AWS creds
      # satisfy the SDK signer; the mock ignores them. Set APP_SES_ENDPOINT blank
      # + real creds to route to actual SES instead.
      APP_SES_ENDPOINT: ${APP_SES_ENDPOINT:-http://ses:8005}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      APP_SES_REGION: ${APP_SES_REGION:-eu-north-1}
      APP_SES_FROM_ADDRESS: ${APP_SES_FROM_ADDRESS:-noreply@example.com}
      # Avatars → MinIO in dev. endpoint is the in-network address (app→minio);
      # public-base-url is the host-reachable address (browser fetches the URL).
      APP_S3_REGION: ${APP_S3_REGION:-eu-north-1}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-avatars}
      APP_S3_PUBLIC_BASE_URL: ${APP_S3_PUBLIC_BASE_URL:-http://localhost:9000/avatars}
      APP_S3_ENDPOINT: ${APP_S3_ENDPOINT:-http://minio:9000}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-minioadmin}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:-minioadmin}
    depends_on:
      - db
      - minio
      - redis
      - kafka
      - ses
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./pom.xml

  # Dev-only data seeder. Waits for the app's Flyway migrations to finish,
  # then applies an idempotent SQL seed (verified admin user + demo operator +
  # catalog/availability/pages data). Runs once and exits. Never deployed.
  # Login: admin@vointika.test / password
  seed:
    image: postgres:17.9
    depends_on:
      - db
      - app
    environment:
      PGPASSWORD: vointika
    volumes:
      - ./docker/dev-seed:/seed:ro
    command: ["sh", "/seed/run.sh"]
    restart: "no"

volumes:
  pgdata:
  miniodata:
